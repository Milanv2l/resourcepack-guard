plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.3 ships unobfuscated: Loom rejects officialMojangMappings() here
	// ("Cannot use Mojang mappings in a non-obfuscated environment"), and there is no Yarn
	// release for 26.3, so no mappings dependency is declared at all.
	// Plain 'implementation': Loom 1.19.4 skips the mod* remap configurations when the
	// Minecraft jar is not obfuscated (RemapConfigurations#configureClientConfigurations returns
	// early on disableObfuscation()), so 'modImplementation' does not exist for 26.3.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
